# Builds the Windows installer on a real Windows runner and publishes it as a
# GitHub release named after the version in package.json.
name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run dist:win

      # Real-Windows checks. Results go to the ci-logs branch for review; they
      # never block the installer from being published.
      - name: Windows integration checks
        continue-on-error: true
        timeout-minutes: 20
        run: |
          npx esbuild apps/desktop/src/platform/windows.ts --bundle --platform=node --format=cjs --outfile=ci-build/windows.cjs --log-level=warning
          node scripts/win-integration.cjs ci-results ci-build/windows.cjs

      - name: End-to-end check of the packaged app
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/win-e2e.cjs ci-results

      - name: Save check results to the ci-logs branch
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-results && echo "$GITHUB_SHA" > ci-results/commit.txt
          tmp="$RUNNER_TEMP/ci-results" && rm -rf "$tmp" && cp -r ci-results "$tmp"
          git config user.name "neondeck-ci" && git config user.email "ci@users.noreply.github.com"
          git switch --orphan ci-logs
          git rm -rf --cached . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true
          cp -r "$tmp"/. .
          git add -A && git commit -q -m "CI results for $GITHUB_SHA"
          git push -f origin ci-logs
          git switch -f main

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./apps/desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NEONDECK ${{ steps.version.outputs.version }} (Windows preview)
          body: |
            Unsigned preview build for Windows 11. SmartScreen will warn: choose "More info", then "Run anyway".
            See the README for what has and has not been tested.
          files: apps/desktop/release/*.exe
          fail_on_unmatched_files: true
